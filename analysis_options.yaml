# Konfigurasi analyzer — mengikuti "Panduan Teknis Arsitektur & Clean Code
# Flutter" (lib/guide.md §1.1). Tujuannya menangkap code smell sejak fase
# kompilasi, bukan saat runtime di perangkat.

include: package:flutter_lints/flutter.yaml

analyzer:
  # Strict typing: menutup celah cast implisit, inferensi `dynamic`, dan
  # penggunaan generic tanpa argumen tipe.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    missing_required_param: error
    missing_return: error
    parameter_assignments: warning

  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # ── Panduan §1.1 ────────────────────────────────────────────────────
    - always_declare_return_types
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - prefer_final_locals
    - avoid_print
    - use_key_in_widget_constructors
    - require_trailing_commas

    # ── Pendukung panduan §1.2 (immutability & null safety defensif) ────
    - prefer_const_constructors_in_immutables
    - unnecessary_null_checks
    - null_check_on_nullable_type_parameter
    - avoid_returning_null_for_void

    # ── Pendukung panduan §2 (OOP: enkapsulasi & abstraksi) ─────────────
    - use_super_parameters
    - unnecessary_this
    - avoid_unused_constructor_parameters
